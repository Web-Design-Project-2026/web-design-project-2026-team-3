<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Between The Lines</title>

    <!--Logo font-->
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!--CSS FILES-->

    <!--General one ( header and footer for all pages )-->
    <link rel="stylesheet" href="CSS/header-footer.css" />
    <!--Page-specific -->
    <link rel="stylesheet" href="CSS/shopping-cart.css" />

    <!--JS files-->
    <script src="JS/mainpage-mobilemenu.js" defer></script>
    <script src="JS/cart.js" defer></script>
  </head>
  <body>
    <!--HEADER -->
    <header>
      <nav class="nav-inner" aria-label="Main navigation">
        <a
          href="index.html"
          class="nav-logo"
          aria-label="Between the Lines, Home"
          ><img
            src="images/main-logotype-and-icon 1.svg"
            alt="Logo"
            id="logo"
          />
        </a>

        <!-- Desktop version links -->
        <ul class="nav-links" role="list">
          <li><a href="index.html">Home</a></li>
          <li><a href="schedule.html">Schedule</a></li>
          <li><a href="tickets.html">Tickets</a></li>
        </ul>

        <!-- Desktop cart -->
        <a href="shoppingCart.html" class="nav-cart" aria-label="Shopping cart"
          ><img
            src="images/shopping-cart.svg"
            alt="Shopping Cart icon"
            id="Cart-icon"
          />
        </a>

        <!-- Ham -->
        <button
          class="nav-hamburger"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
          onclick="openMenu()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </nav>
    </header>

    <!-- MOBILE MENU -->
    <div
      class="mobile-menu"
      id="mobile-menu"
      role="dialog"
      aria-modal="true"
      aria-label="Navigation menu"
    >
      <div class="mobile-menu-header">
        <button
          class="mobile-menu-close"
          aria-label="Close menu"
          onclick="closeMenu()"
        >
          X
        </button>
      </div>
      <nav class="mobile-menu-links" aria-label="Mobile navigation">
        <a href="index.html" onclick="closeMenu()">Home</a>
        <a href="schedule.html" onclick="closeMenu()">Schedule</a>
        <a href="tickets.html" onclick="closeMenu()">Tickets</a>
        <a href="#contact" onclick="closeMenu()">Contact us</a>
        <a href="shoppingCart.html" onclick="closeMenu()">Shopping cart</a>
      </nav>
    </div>

    <!--MAIN -->
    <main>
      <h1 class="cartTitle">SHOPPING CART</h1>
      <div id="cart-content"></div>
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-inner">
        <nav class="footer-links" aria-label="Footer navigation">
          <a href="index.html">Home</a>
          <a href="schedule.html">Schedule</a>
          <a href="tickets.html">Tickets</a>
          <a href="#contact">Contact us</a>
          <a href="#privacy">Privacy Policy</a>
          <a href="#terms">Terms of Service</a>
          <span class="footer-copyright">©Between the Lines, 2026.</span>
        </nav>
      </div>
    </footer>
  </body>
</html>
